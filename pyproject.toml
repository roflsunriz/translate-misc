[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "translate-misc-pipeline"
version = "0.1.0"
description = "URLから翻訳記事の下書きを作成し、レビュー後にMkDocsへ公開するパイプライン"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mkdocs>=1.6,<2",
  "trafilatura>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
translate-article = "translation_pipeline.cli:main"

[project.gui-scripts]
translate-article-gui = "translation_pipeline.gui:main"

[tool.setuptools.packages.find]
include = ["translation_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["translation_pipeline", "tests"]

[[tool.mypy.overrides]]
module = ["trafilatura", "trafilatura.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytest", "pytest.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
